# Layered on top of the main application.properties for every test; the `test` profile is
# activated by the `test` task in build.gradle.

# The scheduler is off by default in the suite. @SpringBootTest contexts are cached and outlive
# the class that created them, so a live scheduler keeps ticking underneath later tests and
# flips the PENDING orders they are asserting on. The one test that needs the real wiring turns
# it back on for itself and closes its context afterwards.
orders.scheduler.enabled=false
orders.scheduler.promotion-rate-ms=60000
